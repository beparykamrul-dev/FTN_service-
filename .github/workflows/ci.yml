name: FTN CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -w $(find . -name '*.go' -not -path './vendor/*')
      - run: go vet ./...
      - run: go test ./...

  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for accidental secrets
        run: |
          ! grep -RInE '(BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})' --exclude-dir=.git .
      - name: Validate required project documents
        run: |
          test -f README.md
          test -f go.mod
          test -f docs/WORKFLOW-FINAL.md
          test -f docs/FINAL-PRODUCTION-CLOSURE.md

  android:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/ftnvpn-android/**/gradlew') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cd apps/ftnvpn-android && ./gradlew test
